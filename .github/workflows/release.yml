name: 📦 Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to a draft GitHub Release (false creates validation artifacts only)"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && inputs.publish != true }}

jobs:
  prepare-release:
    name: 📝 Prepare Staged Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.app_version.outputs.VERSION }}
      publish: ${{ steps.publish_mode.outputs.PUBLISH }}
      release_tag: ${{ steps.release_tag.outputs.RELEASE_TAG }}
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 🧭 Determine publication mode
        id: publish_mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.publish }}" = "true" ]; then
              echo "PUBLISH=true" >> "$GITHUB_OUTPUT"
            else
              echo "PUBLISH=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "PUBLISH=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📖 Read app version
        id: app_version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -e "console.log(require(require('path').join(process.env.GITHUB_WORKSPACE, 'package.json')).version)")"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 🔍 Validate release tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.app_version.outputs.VERSION }}"
          TAG="${GITHUB_REF_NAME}"

          if [ "${TAG}" = "v${VERSION}" ] || [ "${TAG}" = "${VERSION}" ]; then
            echo "RELEASE_TAG=${TAG}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${TAG}" =~ ^${VERSION}[[:alpha:]][[:alnum:]._-]*$ ]]; then
            echo "Accepted draft tag: ${TAG}"
            echo "RELEASE_TAG=${TAG}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Tag (${TAG}) must be v${VERSION}, ${VERSION}, or a draft tag beginning with ${VERSION} followed by a letter."
          exit 1

      - name: 📝 Build bilingual release notes from changelog
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.app_version.outputs.VERSION }}"

          extract_section() {
            local file="$1"
            local version="$2"

            awk -v version="$version" '
              BEGIN {
                capture = 0
                found = 0
              }

              /^## / {
                if (capture) {
                  exit
                }
                if ($0 ~ ("^## \\[" version "\\][[:space:]]*-.*$") || $0 ~ ("^## \\[v" version "\\][[:space:]]*-.*$")) {
                  capture = 1
                  found = 1
                }
              }

              capture {
                if ($0 ~ /^---[[:space:]]*$/) {
                  exit
                }
                print
              }

              END {
                if (!found) {
                  exit 2
                }
              }
            ' "$file"
          }

          # Fork beta tags describe only the delta since the previous beta.
          # Keep formal 1.3.21 releases on the established upstream bundle.
          if [[ "${GITHUB_REF_NAME}" == "1.3.63b1" ]]; then
            RELEASE_VERSIONS=("1.3.63" "1.3.62" "1.3.61" "1.3.60")
          elif [[ "${GITHUB_REF_NAME}" == "1.3.59b4" || "${GITHUB_REF_NAME}" == "v1.3.59b4" ]]; then
            RELEASE_VERSIONS=("1.3.59b4")
          elif [[ "${GITHUB_REF_NAME}" == "1.3.59b3" || "${GITHUB_REF_NAME}" == "v1.3.59b3" ]]; then
            RELEASE_VERSIONS=("1.3.59b3")
          elif [[ "${GITHUB_REF_NAME}" == "1.3.59b2" || "${GITHUB_REF_NAME}" == "v1.3.59b2" ]]; then
            RELEASE_VERSIONS=("1.3.59b2")
          elif [[ "${GITHUB_REF_NAME}" == "1.3.59b1" || "${GITHUB_REF_NAME}" == "v1.3.59b1" ]]; then
            RELEASE_VERSIONS=("1.3.59b1" "1.3.59" "1.3.58")
          elif [[ "${GITHUB_REF_NAME}" == "1.3.57b2" || "${GITHUB_REF_NAME}" == "v1.3.57b2" || "${GITHUB_REF_NAME}" == "1.3.57b3" || "${GITHUB_REF_NAME}" == "v1.3.57b3" ]]; then
            RELEASE_VERSIONS=("1.3.57b2")
          elif [[ "${GITHUB_REF_NAME}" == "1.3.21b4" || "${GITHUB_REF_NAME}" == "v1.3.21b4" ]]; then
            RELEASE_VERSIONS=("1.3.21b4")
          else
            case "${VERSION}" in
              "1.3.0")
                RELEASE_VERSIONS=("1.3.0" "1.2.0" "1.1.5")
                ;;
              "1.3.2")
                RELEASE_VERSIONS=("1.3.2" "1.3.1")
                ;;
              "1.3.21")
                RELEASE_VERSIONS=("1.3.21" "1.3.20" "1.3.19" "1.3.18" "1.3.17" "1.3.16")
                ;;
              "1.3.28")
                RELEASE_VERSIONS=("1.3.28" "1.3.27" "1.3.26" "1.3.25" "1.3.24" "1.3.23" "1.3.22" "1.3.21b4" "1.3.21")
                ;;
              "1.3.31")
                RELEASE_VERSIONS=("1.3.31" "1.3.30" "1.3.29" "1.3.28" "1.3.27" "1.3.26" "1.3.25" "1.3.24" "1.3.23" "1.3.22" "1.3.21b4" "1.3.21")
                ;;
              "1.3.40")
                RELEASE_VERSIONS=("1.3.40" "1.3.39" "1.3.38" "1.3.36" "1.3.35" "1.3.34" "1.3.33")
                ;;
              "1.3.42")
                RELEASE_VERSIONS=("1.3.42" "1.3.41")
                ;;
              "1.3.57")
                RELEASE_VERSIONS=("1.3.57" "1.3.56" "1.3.55" "1.3.54" "1.3.53" "1.3.52" "1.3.51" "1.3.50" "1.3.49" "1.3.48" "1.3.47" "1.3.46" "1.3.45" "1.3.44" "1.3.43")
                ;;
              "1.4.2")
                RELEASE_VERSIONS=("1.4.2" "1.4.1" "1.4.0" "1.3.84" "1.3.83")
                ;;
              "1.3.82")
                RELEASE_VERSIONS=("1.3.82" "1.3.81" "1.3.80" "1.3.79" "1.3.78" "1.3.77" "1.3.76")
                ;;
              "1.3.75")
                RELEASE_VERSIONS=("1.3.75" "1.3.74")
                ;;
              "1.3.73")
                RELEASE_VERSIONS=("1.3.73" "1.3.72" "1.3.71" "1.3.70")
                ;;
              "1.3.69")
                RELEASE_VERSIONS=("1.3.69" "1.3.68" "1.3.67" "1.3.66")
                ;;
              "1.3.65")
                RELEASE_VERSIONS=("1.3.65" "1.3.64")
                ;;
              "1.3.63")
                RELEASE_VERSIONS=("1.3.63" "1.3.62" "1.3.61" "1.3.60")
                ;;
              *)
                RELEASE_VERSIONS=("${VERSION}")
                ;;
            esac
          fi

          zh_section=""
          en_section=""
          for release_version in "${RELEASE_VERSIONS[@]}"; do
            if ! zh_version_section="$(extract_section CHANGELOG.zh-CN.md "$release_version")"; then
              echo "Missing changelog section for version $release_version in CHANGELOG.zh-CN.md"
              exit 1
            fi
            if ! en_version_section="$(extract_section CHANGELOG.md "$release_version")"; then
              echo "Missing changelog section for version $release_version in CHANGELOG.md"
              exit 1
            fi
            zh_section+="${zh_version_section}"$'\n\n'
            en_section+="${en_version_section}"$'\n\n'
          done

          {
            echo "## 更新日志（中文）"
            echo
            printf '%s\n' "$zh_section"
            echo
            echo "## Changelog (English)"
            echo
            printf '%s\n' "$en_section"
          } > release-notes.md

          date -u +"%Y-%m-%dT%H:%M:%SZ" > published-at.txt

      - name: 💾 Preserve previous legacy latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PREVIOUS_TAG="$(
            gh release list \
              --limit 100 \
              --json tagName,isDraft,isPrerelease \
              --jq "[.[] | select(.isDraft == false and .isPrerelease == false and .tagName != \"${GITHUB_REF_NAME}\")][0].tagName // \"\""
          )"
          if [ -z "${PREVIOUS_TAG}" ]; then
            echo "No previous published release was found; refusing to stage without a legacy updater manifest."
            exit 1
          fi

          mkdir -p previous-release
          gh release download "${PREVIOUS_TAG}" \
            --pattern "latest.json" \
            --dir previous-release \
            --clobber
          test -s previous-release/latest.json
          cp previous-release/latest.json legacy-latest.json
          echo "Preserved legacy latest.json from ${PREVIOUS_TAG}"

      # Fork release tags are cloud-build candidates. Keep the release private
      # until it has been reviewed and published manually.
      - name: 🚀 Create or update draft release
        if: steps.publish_mode.outputs.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.release_tag.outputs.RELEASE_TAG }}"
          TITLE="Cockpit Tools ${TAG}"
          if gh release view "${TAG}" > /dev/null 2>&1; then
            IS_DRAFT="$(gh release view "${TAG}" --json isDraft --jq '.isDraft')"
            if [ "${IS_DRAFT}" != "true" ]; then
              echo "Release ${TAG} is already published; refusing to overwrite it as a draft."
              exit 1
            fi
            gh release edit "${TAG}" \
              --title "${TITLE}" \
              --notes-file release-notes.md
          else
            gh release create "${TAG}" \
              --draft \
              --title "${TITLE}" \
              --notes-file release-notes.md
          fi

          cp legacy-latest.json latest.json
          node scripts/release/upload_release_assets.cjs "${TAG}" latest.json
          echo "Draft release ${TAG} is ready for cloud build assets"

      - name: 📤 Upload release metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          retention-days: 7
          if-no-files-found: error
          path: |
            release-notes.md
            published-at.txt
            legacy-latest.json

  prepare-frontend:
    name: "🌐 Prepare production frontend"
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 📦 Install frontend dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: 🔄 Sync release versions
        run: npm run sync-version

      - name: 🏗️ Build production frontend assets
        run: npm run build

      - name: 📤 Share production frontend
        uses: actions/upload-artifact@v4
        with:
          name: build-inputs-release-frontend
          path: dist
          retention-days: 1
          compression-level: 0

  build-windows:
    name: "🏗️ Build: Windows"
    needs:
      - prepare-release
      - prepare-frontend
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare-release.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦀 Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: 💾 Host build cache
        uses: ./.github/actions/host-build-cache
        with:
          target: windows

      - name: ⚙️ Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 📦 Install frontend dependencies
        run: npm install

      - name: 🔄 Sync versions
        run: npm run sync-version

      - name: 📥 Reuse production frontend
        uses: actions/download-artifact@v4
        with:
          name: build-inputs-release-frontend
          path: dist

      - name: 🏗️ Build Windows app
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          npx tauri build --ci --config src-tauri/tauri.prebuilt-frontend.conf.json

      - name: 📦 Build Windows portable archive
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/build_windows_portable.cjs \
            --version "${VERSION}" \
            --release-dir "target/release" \
            --output-dir "portable-assets"

      - name: 📥 Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: release-metadata

      - name: 📦 Stage Windows release assets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/stage_release_assets.cjs \
            --platform windows \
            --assets-dir "target/release/bundle" \
            --output-dir "release-assets"
          cp portable-assets/* release-assets/

      - name: 📤 Upload Windows release assets
        if: needs.prepare-release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          shopt -s nullglob
          ASSETS=(release-assets/*)
          test "${#ASSETS[@]}" -gt 0
          node scripts/release/upload_release_assets.cjs "${TAG}" "${ASSETS[@]}"
          echo "Uploaded ${#ASSETS[@]} Windows assets"

      - name: 📤 Build and upload Windows updater manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PUBLISH: ${{ needs.prepare-release.outputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/build_target_latest_json.cjs \
            --version "${VERSION}" \
            --release-tag "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --assets-dir "release-assets" \
            --notes-file "release-metadata/release-notes.md" \
            --published-at "$(cat release-metadata/published-at.txt)" \
            --targets "windows-x86_64-msi,windows-x86_64-nsis" \
            --output-dir "target-manifests"
          if [ "${RELEASE_PUBLISH}" = "true" ]; then
            node scripts/release/upload_release_assets.cjs "${RELEASE_TAG}" target-manifests/*.json
          fi

      - name: 📦 Upload Windows validation artifacts
        if: needs.prepare-release.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          retention-days: 7
          if-no-files-found: error
          path: |
            release-assets
            target-manifests

      - name: 🧾 Publish Windows package summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          {
            echo "### 🪟 Windows packages"
            echo
            echo "**Mode:** ${{ needs.prepare-release.outputs.publish == 'true' && 'GitHub Release' || 'Validation artifact' }}"
            echo
            if [ "${#assets[@]}" -gt 0 ]; then
              for asset in "${assets[@]}"; do
                printf -- '- `%s`\n' "$(basename "$asset")"
              done
            else
              echo "❌ No staged release packages were produced."
            fi
            if [ "$JOB_STATUS" != "success" ]; then
              echo
              echo "❌ The Windows release job did not complete successfully."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 💾 Preserve legacy updater in draft release
        if: needs.prepare-release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          cp release-metadata/legacy-latest.json latest.json
          node scripts/release/upload_release_assets.cjs "${TAG}" latest.json
          echo "Uploaded the previous legacy latest.json; release remains a draft"

      # Public tag URL verification is disabled while fork builds remain drafts.
      - name: 🔍 Verify published Windows updater manifests
        if: ${{ false }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/verify_published_updater_manifests.cjs \
            --version "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --targets "windows-x86_64-msi,windows-x86_64-nsis" \
            --latest-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
  build-macos-aarch64:
    name: "🏗️ Build: macOS Apple Silicon"
    # Parallel with Windows / macOS Intel after prepare (no hard platform deps).
    needs:
      - prepare-release
      - prepare-frontend
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      APPLE_SIGNING_ENABLED: ${{ vars.APPLE_SIGNING_ENABLED == 'true' && secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare-release.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 💾 macOS release build cache
        uses: ./.github/actions/macos-release-cache
        with:
          target: aarch64-apple-darwin

      - name: ⚙️ Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 📦 Install frontend dependencies
        run: npm install

      - name: 🔄 Sync versions
        run: npm run sync-version

      - name: 📥 Reuse production frontend
        uses: actions/download-artifact@v4
        with:
          name: build-inputs-release-frontend
          path: dist

      - name: 🔐 Prepare Apple signing and notarization
        if: env.APPLE_SIGNING_ENABLED == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_ENABLED == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ env.APPLE_SIGNING_ENABLED == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ env.APPLE_SIGNING_ENABLED == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ env.APPLE_SIGNING_ENABLED == 'true' && secrets.APPLE_TEAM_ID || '' }}
        run: node scripts/release/macos-signing.cjs prepare

      - name: 🏗️ Build macOS Apple Silicon app
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_ENABLED == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ env.APPLE_SIGNING_ENABLED == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ env.APPLE_SIGNING_ENABLED == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ env.APPLE_SIGNING_ENABLED == 'true' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          set -euo pipefail
          if [[ "${APPLE_SIGNING_ENABLED}" != "true" ]]; then
            export APPLE_SIGNING_IDENTITY=-
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          node scripts/tauri.cjs build --ci --target aarch64-apple-darwin --bundles app --config src-tauri/tauri.prebuilt-frontend.conf.json

      - name: 📦 Prepare Universal binary inputs
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/macos-universal.cjs --mode stage \
            --target aarch64-apple-darwin --version "${VERSION}" \
            --output "universal-inputs/aarch64-apple-darwin"

      - name: 📤 Share Universal binary inputs
        uses: actions/upload-artifact@v4
        with:
          name: universal-inputs-aarch64
          path: universal-inputs/aarch64-apple-darwin
          overwrite: true
          retention-days: 1
          compression-level: 1
          if-no-files-found: error

      - name: 📝 Build final DMG with installation instructions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/inject-dmg-readme.cjs \
            --bundle-dir "target/aarch64-apple-darwin/release/bundle" --mac-arch aarch64

      - name: ✅ Notarize final DMG and verify macOS assets
        if: env.APPLE_SIGNING_ENABLED == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_ENABLED == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_TEAM_ID: ${{ env.APPLE_SIGNING_ENABLED == 'true' && secrets.APPLE_TEAM_ID || '' }}
        run: node scripts/release/macos-signing.cjs finalize "target/aarch64-apple-darwin/release/bundle"

      - name: 📥 Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: release-metadata

      - name: 📦 Stage macOS Apple Silicon assets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/stage_release_assets.cjs \
            --platform macos \
            --mac-arch aarch64 \
            --assets-dir "target/aarch64-apple-darwin/release/bundle" \
            --output-dir "release-assets"

      - name: 📤 Upload macOS Apple Silicon assets
        if: needs.prepare-release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          shopt -s nullglob
          ASSETS=(release-assets/*)
          test "${#ASSETS[@]}" -gt 0
          node scripts/release/upload_release_assets.cjs "${TAG}" "${ASSETS[@]}"
          echo "Uploaded ${#ASSETS[@]} macOS Apple Silicon assets"

      - name: 📤 Build and upload macOS Apple Silicon updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PUBLISH: ${{ needs.prepare-release.outputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/build_target_latest_json.cjs \
            --version "${VERSION}" \
            --release-tag "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --assets-dir "release-assets" \
            --notes-file "release-metadata/release-notes.md" \
            --published-at "$(cat release-metadata/published-at.txt)" \
            --targets "darwin-aarch64-app" \
            --output-dir "target-manifests"
          if [ "${RELEASE_PUBLISH}" = "true" ]; then
            node scripts/release/upload_release_assets.cjs "${RELEASE_TAG}" target-manifests/*.json
          fi

      - name: 📦 Upload macOS Apple Silicon validation artifacts
        if: needs.prepare-release.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-aarch64
          retention-days: 7
          if-no-files-found: error
          path: |
            release-assets
            target-manifests

      - name: 🧾 Publish macOS Apple Silicon package summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          {
            echo "### 🍎 macOS Apple Silicon packages"
            echo
            echo "**Mode:** ${{ needs.prepare-release.outputs.publish == 'true' && 'GitHub Release' || 'Validation artifact' }}"
            echo
            if [ "${#assets[@]}" -gt 0 ]; then
              for asset in "${assets[@]}"; do
                printf -- '- `%s`\n' "$(basename "$asset")"
              done
            else
              echo "❌ No staged release packages were produced."
            fi
            if [ "$JOB_STATUS" != "success" ]; then
              echo
              echo "❌ The macOS Apple Silicon release job did not complete successfully."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🧹 Remove temporary Apple signing keychain
        if: always()
        run: node scripts/release/macos-signing.cjs cleanup

  build-macos-x86_64:
    name: "🏗️ Build: macOS Intel"
    # Parallel with Windows / macOS Apple Silicon after prepare.
    needs:
      - prepare-release
      - prepare-frontend
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      APPLE_SIGNING_ENABLED: ${{ vars.APPLE_SIGNING_ENABLED == 'true' && secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
      GH_REPO: ${{ github.repository }}
